# CodSpeed micro-benchmarks (QA optimize σκέλος, φάση 2).
# Public repo → δεν χρειάζεται CODSPEED_TOKEN (δουλεύει μέσω του CodSpeed GitHub App).
# Τι μετράει: tests/benchmarks/ (pure-logic — parse_feature_spec/classify_columns/detect_crosslag_cols).
name: CodSpeed
on:
  push:
    branches: [FEB272026]
  pull_request:
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps (pure-logic benchmarks — μόνο pandas/numpy + pytest-codspeed)
        run: pip install pytest pytest-codspeed pandas numpy
      - name: Run benchmarks under CodSpeed
        uses: CodSpeedHQ/action@v3
        with:
          run: python -m pytest tests/benchmarks/ --codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}
