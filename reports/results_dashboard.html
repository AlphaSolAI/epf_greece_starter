<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>EPF Greece — Συνολικά Αποτελέσματα Σφαλμάτων</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --panel2: #1c2438; --border: #2a3552;
    --text: #e5e7eb; --muted: #9ca3af; --accent: #38bdf8;
    --gold: #eab308; --amber: #fbbf24; --green: #22c55e; --orange: #f97316;
    --purple: #a855f7; --red: #ef4444; --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 20px 28px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 20;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  .wrap { padding: 20px 28px 60px; max-width: 1500px; margin: 0 auto; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px;
  }
  .filters .grp {
    display: flex; align-items: center; gap: 6px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  .filters label { color: var(--muted); font-size: 12px; }
  select, input[type=checkbox] { accent-color: var(--accent); }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px;
  }
  select option:disabled { color: #4b5563; font-style: italic; }
  .avail-badge {
    font-size: 11px; color: var(--green); background: rgba(34,197,94,0.12);
    border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .avail-badge.none { color: var(--red); background: rgba(239,68,68,0.12); }

  .section-title {
    font-size: 15px; margin: 28px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border); color: var(--accent);
  }

  .leaderboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .lb-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; position: relative; overflow: hidden;
  }
  .lb-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .lb-card.price::before { background: var(--accent); }
  .lb-card.load::before { background: var(--green); }
  .lb-period { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .lb-model { font-size: 15px; font-weight: 600; margin: 4px 0 2px; }
  .lb-mae { font-size: 22px; font-weight: 700; color: var(--gold); }
  .lb-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th {
    position: sticky; top: 0; background: var(--panel2);
    color: var(--muted); font-weight: 600; user-select: none; white-space: nowrap;
  }
  tbody tr:hover { background: rgba(56,189,248,0.06); }
  .grp-row td {
    background: var(--panel2); font-weight: 600; color: var(--accent);
    border-top: 2px solid var(--border); padding-top: 10px;
  }
  .grp-row .badge-legacy {
    color: var(--red); font-size: 11px; font-weight: 500; margin-left: 8px;
  }
  .best-row td { color: var(--gold); font-weight: 700; }
  .type-baseline { color: var(--gray); }
  .type-ensemble { color: var(--amber); }
  .type-ml { color: var(--text); }
  .best-star { color: var(--gold); margin-right: 4px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .count-pill { background: var(--panel2); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  a.filelink { color: var(--muted); font-size: 11px; text-decoration: none; }
  a.filelink:hover { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>📊 EPF Greece — Συνολικά Αποτελέσματα Σφαλμάτων (MAE / RMSE / sMAPE)</h1>
  <div class="sub">Όλα τα evaluation runs μαζεμένα σε μία σελίδα — <span id="fileCount"></span> αρχεία αποτελεσμάτων.</div>
  <div class="filters">
    <div class="grp"><label>Task</label>
      <select id="fTask">
        <option value="all">Όλα</option>
        <option value="price">Τιμή (price)</option>
        <option value="load">Φορτίο (load)</option>
      </select>
    </div>
    <div class="grp"><label>Περίοδος</label>
      <select id="fPeriod"><option value="all">Όλες</option></select>
      <span class="avail-badge" id="badgePeriod"></span>
    </div>
    <div class="grp"><label>Στρατηγική</label>
      <select id="fStrategy"><option value="all">Όλες</option></select>
      <span class="avail-badge" id="badgeStrategy"></span>
    </div>
    <div class="grp"><label>Horizon</label>
      <select id="fHorizon">
        <option value="all">Όλα</option>
        <option value="24">H=24</option>
        <option value="168">H=168</option>
        <option value="none">N/A</option>
      </select>
      <span class="avail-badge" id="badgeHorizon"></span>
    </div>
    <div class="grp">
      <label><input type="checkbox" id="fLegacy"> Εμφάνιση παλιών/legacy αρχείων</label>
    </div>
    <div class="grp">
      <label>Ταξινόμηση ομάδων</label>
      <select id="fSort">
        <option value="period">Κατά περίοδο</option>
        <option value="mae">Κατά καλύτερο MAE</option>
      </select>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="section-title">🏆 Best Overall ανά Task × Περίοδο (το καλύτερο μοντέλο, οποιαδήποτε στρατηγική)</div>
  <div id="leaderboard" class="leaderboard"></div>

  <div class="section-title" style="margin-top:32px;">📋 Αναλυτικός Πίνακας Αποτελεσμάτων</div>
  <div id="tables"></div>
</div>

const PERIOD_LABELS = {"week_dec2025": "Εβδομάδα (1-7 Δεκ 2025)", "month_dec2025": "Μήνας (Δεκ 2025)", "month_q4_2025": "3μηνο Q4 2025 (Οκτ-Δεκ)", "month_q1_2026": "3μηνο Q1 2026 (Δεκ-Φεβ)", "retrain_q1_2026": "Walk-Forward Monthly-Retrain (Q1 2026)"};
const PERIOD_ORDER = ["week_dec2025", "month_dec2025", "month_q4_2025", "month_q1_2026", "retrain_q1_2026"];

function fmt(v) { return (v === null || v === undefined) ? '—' : Number(v).toFixed(3); }

function uniqueSorted(arr) { return [...new Set(arr)]; }

function populateSelect(sel, values, labelFn) {
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = labelFn ? labelFn(v) : v;
    sel.appendChild(o);
  });
}

const periods = PERIOD_ORDER.filter(p => RECORDS.some(r => r.period === p));
populateSelect(document.getElementById('fPeriod'), periods, p => PERIOD_LABELS[p] || p);

const strategies = uniqueSorted(RECORDS.map(r => r.strategy));
populateSelect(document.getElementById('fStrategy'), strategies, s => {
  const rec = RECORDS.find(r => r.strategy === s);
  return rec ? rec.strategy_label : s;
});

document.getElementById('fileCount').textContent = RECORDS.length;

function currentFilters() {
  return {
    task: document.getElementById('fTask').value,
    period: document.getElementById('fPeriod').value,
    strategy: document.getElementById('fStrategy').value,
    horizon: document.getElementById('fHorizon').value,
    showLegacy: document.getElementById('fLegacy').checked,
    sortMode: document.getElementById('fSort').value,
  };
}

function filteredRecords() {
  const f = currentFilters();
  return RECORDS.filter(r => {
    if (f.task !== 'all' && r.task !== f.task) return false;
    if (f.period !== 'all' && r.period !== f.period) return false;
    if (f.strategy !== 'all' && r.strategy !== f.strategy) return false;
    if (f.horizon !== 'all') {
      if (f.horizon === 'none' && r.horizon) return false;
      if (f.horizon !== 'none' && r.horizon !== f.horizon) return false;
    }
    if (!f.showLegacy && r.legacy) return false;
    return true;
  });
}

function bestOf(rec) {
  let best = null;
  rec.metrics.forEach(m => {
    if (m.MAE === null || m.MAE === undefined) return;
    if (!best || m.MAE < best.MAE) best = m;
  });
  return best;
}

function renderLeaderboard() {
  const el = document.getElementById('leaderboard');
  el.innerHTML = '';
  const recs = filteredRecords();
  // group by task+period, find global best model (min MAE) across ALL matching records
  const groups = {};
  recs.forEach(r => {
    const key = r.task + '|' + r.period;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const keys = Object.keys(groups).sort((a,b) => {
    const [ta, pa] = a.split('|'); const [tb, pb] = b.split('|');
    const oa = PERIOD_ORDER.indexOf(pa), ob = PERIOD_ORDER.indexOf(pb);
    if (oa !== ob) return oa - ob;
    return ta.localeCompare(tb);
  });
  if (!keys.length) { el.innerHTML = '<div class="empty">Δεν υπάρχουν δεδομένα για αυτά τα φίλτρα.</div>'; return; }
  keys.forEach(key => {
    const [task, period] = key.split('|');
    let globalBest = null, bestRec = null;
    groups[key].forEach(r => {
      const b = bestOf(r);
      if (b && (!globalBest || b.MAE < globalBest.MAE)) { globalBest = b; bestRec = r; }
    });
    if (!globalBest) return;
    const card = document.createElement('div');
    card.className = 'lb-card ' + task;
    card.innerHTML = `
      <div class="lb-period">${task === 'price' ? 'Τιμή' : 'Φορτίο'} · ${PERIOD_LABELS[period] || period}</div>
      <div class="lb-model">${globalBest.Model}</div>
      <div class="lb-mae">${fmt(globalBest.MAE)} <span style="font-size:12px;color:var(--muted);">${bestRec.unit}</span></div>
      <div class="lb-meta">RMSE ${fmt(globalBest.RMSE)} · sMAPE ${fmt(globalBest.sMAPE)}% · ${bestRec.strategy_label}${bestRec.horizon ? ' (H='+bestRec.horizon+')' : ''}</div>
    `;
    el.appendChild(card);
  });
}

function renderTables() {
  const el = document.getElementById('tables');
  el.innerHTML = '';
  const f = currentFilters();
  let recs = filteredRecords();
  if (!recs.length) { el.innerHTML = '<div class="empty">Δεν υπάρχουν αρχεία αποτελεσμάτων για αυτά τα φίλτρα.</div>'; return; }

  if (f.sortMode === 'period') {
    recs = recs.slice().sort((a,b) => {
      const oa = PERIOD_ORDER.indexOf(a.period), ob = PERIOD_ORDER.indexOf(b.period);
      if (oa !== ob) return oa - ob;
      if (a.task !== b.task) return a.task.localeCompare(b.task);
      return a.strategy.localeCompare(b.strategy);
    });
  } else {
    recs = recs.slice().sort((a,b) => {
      const ba = bestOf(a), bb = bestOf(b);
      const va = ba ? ba.MAE : Infinity, vb = bb ? bb.MAE : Infinity;
      return va - vb;
    });
  }

  recs.forEach(rec => {
    const card = document.createElement('div');
    card.className = 'card';
    const best = bestOf(rec);
    const rows = rec.metrics.slice().sort((a,b) => (a.MAE ?? Infinity) - (b.MAE ?? Infinity));
    let tbody = '';
    rows.forEach(m => {
      const isBest = best && m.Model === best.Model && m.MAE === best.MAE;
      tbody += `<tr class="${isBest ? 'best-row' : ''}">
        <td>${isBest ? '<span class="best-star">★</span>' : ''}${m.Model}</td>
        <td class="type-${m.Type}">${m.Type}</td>
        <td>${fmt(m.MAE)}</td>
        <td>${fmt(m.RMSE)}</td>
        <td>${fmt(m.sMAPE)}%</td>
      </tr>`;
    });
    card.innerHTML = `
      <div class="grp-row" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          ${rec.task === 'price' ? '💶' : '⚡'} <b>${rec.label}</b>
          ${rec.legacy ? '<span class="badge-legacy">⚠ LEGACY/ΠΑΛΙΟ</span>' : ''}
        </div>
        <div>
          <span class="count-pill">${rows.length} μοντέλα · μονάδα ${rec.unit}</span>
          <a class="filelink" href="${rec.file}" target="_blank">${rec.file}</a>
        </div>
      </div>
      <table>
        <thead><tr><th>Model (ταξινομημένο ↑ MAE)</th><th>Type</th><th>MAE</th><th>RMSE</th><th>sMAPE</th></tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    `;
    el.appendChild(card);
  });
}

const HORIZON_LABELS = { "24": "H=24", "168": "H=168", "none": "N/A" };

// Marks each <option> of a select as available (🟢, enabled) or unavailable (⚪, disabled)
// based on how many RECORDS match the *other currently active filters* for that option's value.
// This gives cascading "what actually exists" feedback the moment a dropdown is opened.
function markOptionsAvailability(selectEl, counts, badgeEl) {
  let availableCount = 0, totalCount = 0;
  Array.from(selectEl.options).forEach(opt => {
    if (opt.value === 'all') return;
    totalCount++;
    const c = counts[opt.value] || 0;
    if (c > 0) availableCount++;
    const base = opt.dataset.baseLabel || opt.textContent.replace(/^(🟢|⚪)\s/, '').replace(/\s\(\d+\)$/, '');
    opt.dataset.baseLabel = base;
    opt.textContent = (c > 0 ? '🟢 ' : '⚪ ') + base + ' (' + c + ')';
    opt.disabled = c === 0;
  });
  const allOpt = selectEl.querySelector('option[value="all"]');
  if (allOpt) {
    const grandTotal = Object.values(counts).reduce((a, b) => a + b, 0);
    allOpt.textContent = 'Όλες (' + grandTotal + ')';
  }
  if (badgeEl) {
    badgeEl.textContent = availableCount + ' / ' + totalCount + ' διαθέσιμα';
    badgeEl.classList.toggle('none', availableCount === 0);
  }
}

function refreshAvailability() {
  const f = currentFilters();

  // Period options depend only on Task (+ legacy toggle)
  const periodCounts = {};
  RECORDS.forEach(r => {
    if (!f.showLegacy && r.legacy) return;
    if (f.task !== 'all' && r.task !== f.task) return;
    periodCounts[r.period] = (periodCounts[r.period] || 0) + 1;
  });
  markOptionsAvailability(document.getElementById('fPeriod'), periodCounts, document.getElementById('badgePeriod'));

  // Strategy options depend on Task + Period (+ legacy toggle)
  const stratCounts = {};
  RECORDS.forEach(r => {
    if (!f.showLegacy && r.legacy) return;
    if (f.task !== 'all' && r.task !== f.task) return;
    if (f.period !== 'all' && r.period !== f.period) return;
    stratCounts[r.strategy] = (stratCounts[r.strategy] || 0) + 1;
  });
  markOptionsAvailability(document.getElementById('fStrategy'), stratCounts, document.getElementById('badgeStrategy'));

  // Horizon options depend on Task + Period + Strategy (+ legacy toggle)
  const horizonCounts = {};
  RECORDS.forEach(r => {
    if (!f.showLegacy && r.legacy) return;
    if (f.task !== 'all' && r.task !== f.task) return;
    if (f.period !== 'all' && r.period !== f.period) return;
    if (f.strategy !== 'all' && r.strategy !== f.strategy) return;
    const hKey = r.horizon ? r.horizon : 'none';
    horizonCounts[hKey] = (horizonCounts[hKey] || 0) + 1;
  });
  markOptionsAvailability(document.getElementById('fHorizon'), horizonCounts, document.getElementById('badgeHorizon'));
}

function renderAll() { refreshAvailability(); renderLeaderboard(); renderTables(); }

['fTask','fPeriod','fStrategy','fHorizon','fLegacy','fSort'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderAll);
});

renderAll();
</script>
